  <script>
  (function(){
    var STAGES=[["相談","対象とゴール"],["条件設定","すり合わせ"],["検索","規約に沿って"],["確認","関連を見分ける"],["報告","整理して渡す"]];
    var CAPS=["相談：対象とゴールを確認します。","条件設定：対象名・別名・地域・期間をすり合わせます。","検索：公開情報のみ、規約に沿って確認します（自動収集はしません）。","確認：投稿が自分のお店のものかを確認します（確定せず候補として残します）。","報告：関連・別店舗・保留に整理して報告します。"];
    var host=document.getElementById("sns-flow");
    var cap=document.getElementById("sns-flow-caption");
    STAGES.forEach(function(st,i){
      if(i>0){var c=document.createElement("div");c.className="conn";host.appendChild(c);}
      var n=document.createElement("div");n.className="node";
      n.innerHTML='<div class="box"><div class="t">'+st[0]+'</div><div class="s">'+st[1]+'</div></div>';
      host.appendChild(n);
    });
    var nodes=host.querySelectorAll(".node"),conns=host.querySelectorAll(".conn"),i=0;
    function paint(){
      nodes.forEach(function(n,k){n.classList.toggle("active",k===i);n.classList.toggle("done",k<i);});
      conns.forEach(function(c,k){c.classList.toggle("lit",i>k);});
      cap.textContent=CAPS[i];
    }
    paint();
    if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
      setInterval(function(){ i=(i+1) % STAGES.length; paint(); }, 2400);
    }
  })();
</script>
  <script src="motion.js"></script>
