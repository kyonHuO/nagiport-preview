    <div class="section-heading"><p class="eyebrow">SOCIAL LISTENING / 開発中</p><h1>相談から、<br>関連する投稿の確認まで。</h1></div>
    <p class="availability-note"><span class="status-pill">開発中・架空の例</span> 図と投稿はイメージです。SNSの自動収集は行いません。</p>
    <section class="sns-flow-demo" aria-labelledby="sns-flow-title">
      <div class="section-heading"><h2 id="sns-flow-title">相談から報告までの流れ</h2><p>時間で進みます。<strong>タップすると、その段に戻ります。</strong></p></div>
      <div class="sns-flow" id="sns-flow" role="tablist" aria-label="相談から報告までの流れ"></div>
      <p class="sns-flow-caption" id="sns-flow-caption" role="status" aria-live="polite"></p>
    </section>

  <script>
    (function () {
      var STAGES = [
        ["相談", "対象とゴール", "相談：対象とゴールを確認します。"],
        ["条件設定", "すり合わせ", "条件設定：対象名・別名・地域・期間をすり合わせます。"],
        ["検索", "規約に沿って", "検索：公開情報のみ、規約に沿って確認します（自動収集はしません）。"],
        ["確認", "関連を見分ける", "確認：投稿が自分のお店のものかを確認します（確定せず候補として残します）。"],
        ["報告", "整理して渡す", "報告：関連・別店舗・保留に整理して報告します。"]
      ];
      var host = document.getElementById("sns-flow");
      var cap = document.getElementById("sns-flow-caption");
      var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var buttons = [];

      STAGES.forEach(function (st, i) {
        if (i > 0) { var c = document.createElement("div"); c.className = "conn"; host.appendChild(c); }
        var b = document.createElement("button");
        b.type = "button";
        b.className = "node";
        b.setAttribute("role", "tab");
        b.innerHTML = '<span class="box"><span class="t">' + st[0] + '</span><span class="s">' + st[1] + "</span></span>";
        b.addEventListener("click", function () { select(i, true); });
        host.appendChild(b);
        buttons.push(b);
      });
      var conns = host.querySelectorAll(".conn");
      var i = 0;
      var timer = null;

      function paint() {
        buttons.forEach(function (b, k) {
          b.classList.toggle("active", k === i);
          b.classList.toggle("done", k < i);
          b.setAttribute("aria-selected", String(k === i));
        });
        conns.forEach(function (c, k) { c.classList.toggle("lit", i > k); });
        cap.textContent = STAGES[i][2];
      }
      function select(n, user) {
        i = (n + STAGES.length) % STAGES.length;
        paint();
        if (user) restart();
      }
      function restart() {
        if (reduced) return;
        if (timer) clearInterval(timer);
        timer = setInterval(function () { i = (i + 1) % STAGES.length; paint(); }, 2400);
      }
      paint();
      restart();
    })();
  </script>
  <script src="motion.js"></script>
</body>
</html>
